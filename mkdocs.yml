INHERIT: .relcon-docs/base.yml
site_name: Strange Loop
site_url: http://localhost:8000/
nav:
  - User Guide:
      - Build a flow: index.md
      - Example — follow one repair: guide/one-repair.md
      - Batch and check items: guide/verification.md
      - Repair or replace items: guide/candidates.md
      - Inspect revisions: guide/lineage.md
  - API Reference: reference.md
plugins:
  mkdocstrings:
    handlers:
      python:
        paths: [src]
        options:
          show_root_heading: true
          heading_level: 2
          show_object_full_path: true
          merge_init_into_class: true
