# Project-owned workflow: configure creates this once and never overwrites it.
name: Deploy documentation

on:
  workflow_dispatch: # Allow manual deployment.

  # Uncomment to deploy on pushes to main (for example, consumer projects):
  # push:
  #   branches: [main]

  # Or uncomment to deploy on published releases (for example, BONDI):
  # release:
  #   types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    # Replace @main with a reviewed commit SHA to pin the deployment implementation.
    uses: relaxed-constraints/relcon-docs/.github/workflows/deploy-docs.yml@main
