name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    name: Python ${{ matrix.python }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked --with pymongo --with numpy --with pandas --with matplotlib pytest
  quality:
    name: Lint, docs and distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.12"
      - run: uv sync --locked --group docs
      - run: uv run ruff check .
      - run: uv run ruff format --check src tests examples
      - run: uv run --group docs relcon-docs configure --check
      - run: uv run --group docs zensical build --strict
      - run: uv build --out-dir dist
      - run: uvx --from twine twine check --strict dist/*
      - name: Install the built wheel outside the checkout
        run: |
          uv venv /tmp/strange-loop-wheel
          uv pip install --python /tmp/strange-loop-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/strange-loop-wheel/bin/python -c "from strange_loop import Loop, Version; assert Version(42).value == 42"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/
